name: Secure DevSecOps Pipeline - Day 2

on: 
  push: 
    branches: 
      - main 
      - master 
  workflow_dispatch: 

jobs: 
  build_and_package: 
    name: BUILD-JOB 

    # Condition: Runs on push or manual trigger[cite: 2]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' 
     
    runs-on: ${{ matrix.os }} 
     
    strategy: 
      fail-fast: false
      matrix: 
        os: 
          - ubuntu-latest 
        node-version: 
          - 18 
          - 20 
        language: 
          - javascript-typescript 
     
    permissions: 
      actions: read 
      contents: read 
      security-events: write 
     
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: Setup Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: ${{ matrix.node-version }} 

      # Day-2: Caching dependencies to speed up future runs[cite: 2]
      - name: Cache Dependencies 
        uses: actions/cache@v4 
        with: 
          path: ~/.npm 
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }} 
          restore-keys: | 
            ${{ runner.os }}-node-${{ matrix.node-version }}- 
     
      - name: Install Dependencies 
        run: npm install 
     
      - name: Test 
        run: echo "code is tested!" 
     
      - name: Artifact Upload 
        uses: actions/upload-artifact@v4 
        with: 
          name: artifact-${{ runner.os }}-node-${{ matrix.node-version }} 
          path: | 
            package* 
     
      - name: Deploy 
        run: echo "my code is deployed" 
     
      # Day-2: Status Check function for failure handling[cite: 2]
      - name: Rollback 
        if: failure() 
        run: echo "rollback is done because a step failed!"